[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dxanon"
version = "0.1.4"
description = "Local, offline anonymiser for Word documents before submitting them to an AI"
requires-python = ">=3.11"
dependencies = ["lxml>=5.0"]

# Reading a scan. Optional, and the window says so when a scan is
# offered to a build that has not got it: the engine and its runtime
# weigh more than everything else here put together, and most of what
# this program does needs neither.
[project.optional-dependencies]
# Capped by the engine itself, which declares < 3.13: on a newer
# interpreter pip found no version at all and the whole install failed,
# including the parts that have nothing to do with reading images. With
# the marker, installing on 3.14 succeeds without the engine and the
# window says it cannot read images, which is a working program.
ocr = ['rapidocr-onnxruntime>=1.3,<2; python_version < "3.13"']
# Reading a PDF. pypdfium2 wraps Google's PDFium under Apache 2.0 and
# BSD, and does both halves of the job: the text of a page that has
# text, and the image of one that has not. The obvious library for
# this is PyMuPDF, which is AGPL: bundling it in an executable handed
# to somebody would put this whole program under that licence, and
# this repository has no licence of its own yet. Taking that decision
# by accident, through a dependency, would be the wrong order.
pdf = ["pypdfium2>=4.25"]

[project.scripts]
dxanon = "dxanon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
