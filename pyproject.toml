[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dxanon"
version = "0.1.4"
description = "Local, offline anonymiser for Word documents before submitting them to an AI"
requires-python = ">=3.11"
dependencies = ["lxml>=5.0"]

# Reading a scan. Optional, and the window says so when a scan is
# offered to a build that has not got it: the engine and its runtime
# weigh more than everything else here put together, and most of what
# this program does needs neither.
[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3,<2"]

[project.scripts]
dxanon = "dxanon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
