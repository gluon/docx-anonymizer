name: ci

# Windows is the platform this ships on and the only one no developer
# here runs, so it is tested on every push: the first time it ran, it
# caught a column that fits on macOS and is cut off there. The repo is
# public, so the runners cost nothing.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Tests
        # Bounded: a test that waits on something nobody answers used to
        # hold the job until its own six-hour limit, and the log of a
        # step that never ends cannot be read.
        timeout-minutes: 10
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src:tests

  windows:
    # Path handling, default encodings and font metrics all differ here,
    # and all three have broken this code.
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . PySide6
      - name: Tests
        # The Qt tests run here and nowhere else, so this is where a
        # window waiting on a modal box hangs. Ten minutes against a
        # suite that takes two.
        timeout-minutes: 10
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src;tests
      - name: Import the window against a real PySide6
        # The suite never shows the window, so this is the only thing
        # standing between a typo in gui.py and a user double-clicking an
        # executable that does nothing.
        run: python -c "import dxanon.gui; print('ok', dxanon.gui.Window.__name__)"
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    # The executable is only worth building for a release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    # Creating the release writes to the repository, and the default
    # token is read-only on a repository that has never granted it more.
    # That is why the first build that worked produced an executable,
    # uploaded it as an artifact, and then failed to publish it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . PySide6 pyinstaller
      - name: Build the executable
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name Anonymiseur
          --paths src
          --collect-submodules dxanon
          --hidden-import lxml._elementpath
          anonymiseur.py

      - name: Check the executable starts
        # Not a functional test: it proves the bundle is complete, which
        # is where one-file builds fail. A missing hidden import shows up
        # only at runtime, on the user's machine, as a window that never
        # opens.
        #
        # Bounded in time, because a --windowed build reports a fatal
        # startup error in a message box that waits for a click: without
        # a timeout the step hangs until the job's own six-hour limit,
        # and says nothing about why.
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath dist\Anonymiseur.exe -ArgumentList '--self-check' -PassThru
          if (-not $p.WaitForExit(120000)) {
            $p.Kill()
            throw "the executable did not exit within 2 minutes: it is most likely showing a startup error box"
          }
          if ($p.ExitCode -ne 0) { throw "the executable exited with $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: Anonymiseur-windows
          path: dist/Anonymiseur.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Anonymiseur.exe
