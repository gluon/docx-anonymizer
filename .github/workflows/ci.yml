name: ci

# Windows is the platform this ships on and the only one no developer
# here runs, so it is tested on every push: the first time it ran, it
# caught a column that fits on macOS and is cut off there. The repo is
# public, so the runners cost nothing.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[ocr]
      - name: Tests
        # Bounded: a test that waits on something nobody answers used to
        # hold the job until its own six-hour limit, and the log of a
        # step that never ends cannot be read.
        #
        # Failures are repeated as annotations, which the API serves.
        # Downloading a job's log needs a host some networks refuse, and
        # a red cross with no readable reason is worth very little.
        timeout-minutes: 10
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/tests.log && exit 0
          grep -E "^(FAIL|ERROR):|AssertionError|modal box" /tmp/tests.log \
            | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          exit 1
        env:
          PYTHONPATH: src:tests

  windows:
    # Path handling, default encodings and font metrics all differ here,
    # and all three have broken this code.
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[ocr] PySide6
      - name: Tests
        # The Qt tests run here and nowhere else, so this is where a
        # window waiting on a modal box hangs. Ten minutes against a
        # suite that takes two.
        #
        # Failures are repeated as annotations: see the same step on the
        # other job.
        timeout-minutes: 10
        run: |
          # Written to a file, not captured in a variable: unittest
          # prints to stderr, and "2>&1" into a PowerShell variable
          # turns every line into an error object, which Select-String
          # does not match as text. The first attempt at this emitted no
          # annotation at all and the failure stayed unreadable.
          python -m unittest discover -s tests -v > tests.log 2>&1
          $code = $LASTEXITCODE
          Get-Content tests.log | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Select-String -Path tests.log `
                -Pattern 'FAIL:|ERROR:|AssertionError|modal box|in test_|Timeout \(' `
              | Select-Object -First 25 `
              | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            throw "tests failed with exit code $code"
          }
        env:
          PYTHONPATH: src;tests
      - name: Import the window against a real PySide6
        # The suite never shows the window, so this is the only thing
        # standing between a typo in gui.py and a user double-clicking an
        # executable that does nothing.
        run: python -c "import dxanon.gui; print('ok', dxanon.gui.Window.__name__)"
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    # Built for a release, and on demand for a branch. A branch cannot be
    # tested on Windows without an executable, and tagging one just to
    # get a file would put a half-finished version in the releases next
    # to the one people install. Dispatched, the executable is an
    # artifact of the run and nothing else.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' 
    needs: windows
    runs-on: windows-latest
    # Creating the release writes to the repository, and the default
    # token is read-only on a repository that has never granted it more.
    # That is why the first build that worked produced an executable,
    # uploaded it as an artifact, and then failed to publish it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[ocr] PySide6 pyinstaller
      - name: Build the executable
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name Anonymiseur
          --paths src
          --collect-submodules dxanon
          --hidden-import lxml._elementpath
          --collect-all rapidocr_onnxruntime
          --collect-all onnxruntime
          anonymiseur.py

      - name: Check the executable starts
        # Not a functional test: it proves the bundle is complete, which
        # is where one-file builds fail. A missing hidden import shows up
        # only at runtime, on the user's machine, as a window that never
        # opens.
        #
        # Bounded in time, because a --windowed build reports a fatal
        # startup error in a message box that waits for a click: without
        # a timeout the step hangs until the job's own six-hour limit,
        # and says nothing about why.
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath dist\Anonymiseur.exe -ArgumentList '--self-check' -PassThru
          if (-not $p.WaitForExit(120000)) {
            $p.Kill()
            throw "the executable did not exit within 2 minutes: it is most likely showing a startup error box"
          }
          if ($p.ExitCode -ne 0) { throw "the executable exited with $($p.ExitCode)" }

      - name: Check the engine made it into the bundle
        # This job installs the recognition engine on purpose, so a
        # bundle without it is a bundle that dropped a package in
        # silence, which is the failure one-file builds are good at and
        # which would otherwise reach the user as "cette version ne sait
        # pas lire les images".
        timeout-minutes: 3
        run: |
          dist\Anonymiseur.exe --self-check > check.log 2>&1
          Get-Content check.log | ForEach-Object { Write-Host $_ }
          if (-not (Select-String -Path check.log -Pattern "lecture d'images incluse" -Quiet)) {
            # The reason travels as an annotation: a job's log needs a
            # host some networks refuse, and "no engine" on its own does
            # not say whether a package, a model file or a native
            # library is missing.
            Get-Content check.log `
              | Select-Object -First 20 `
              | ForEach-Object { Write-Host "::error::$_" }
            throw "the bundle has no recognition engine"
          }

      - name: A name an artifact is allowed to have
        # A branch name carries a slash and an artifact name may not:
        # the executable built, started, and was then thrown away on
        # upload for the name it had been given.
        id: naming
        shell: bash
        run: echo "slug=$(echo '${{ github.ref_name }}' | tr '/:' '--')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Anonymiseur-windows-${{ steps.naming.outputs.slug }}
          path: dist/Anonymiseur.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Anonymiseur.exe
          # A tag carrying a hyphen is a trial version, and says so on
          # the releases page rather than looking like the one to
          # install.
          prerelease: ${{ contains(github.ref_name, '-') }}
