name: ci

# Minutes are finite, so the cheap job runs on every push and the
# expensive ones only when they can tell you something new: a Windows
# run and a build on a tag, or on demand.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the Windows job and build the executable"
        type: boolean
        default: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src:tests

  windows:
    # Windows minutes bill at twice the Linux rate, so this runs on tags
    # and on demand rather than on every push. Path handling and default
    # encodings differ there, and both have broken this kind of code.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.full
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . PySide6
      - name: Tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src;tests
      - name: Import the window against a real PySide6
        # The suite never shows the window, so this is the only thing
        # standing between a typo in gui.py and a user double-clicking an
        # executable that does nothing.
        run: python -c "import dxanon.gui; print('ok', dxanon.gui.Window.__name__)"
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.full
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . PySide6 pyinstaller
      - name: Build the executable
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name Anonymiseur
          --paths src
          --collect-submodules dxanon
          --hidden-import lxml._elementpath
          src/dxanon/__main__.py

      - name: Check the executable starts
        # Not a functional test: it proves the bundle is complete, which
        # is where one-file builds fail. A missing hidden import shows up
        # only at runtime, on the user's machine, as a window that never
        # opens.
        run: |
          $p = Start-Process -FilePath dist\Anonymiseur.exe -ArgumentList '--self-check' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "the executable exited with $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: Anonymiseur-windows
          path: dist/Anonymiseur.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Anonymiseur.exe
