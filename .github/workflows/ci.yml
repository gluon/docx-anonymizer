name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    # The engine is pure Python, but the product ships on Windows, so the
    # suite runs there too: path handling and default encodings differ.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src${{ matrix.os == 'windows-latest' && ';' || ':' }}tests
